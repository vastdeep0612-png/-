<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 | 백현팀</title>
  <style>

    @font-face {
      font-family: 'NanumSquareRound';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'BookkMyungjo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --panel: #ffffff;
      --line: rgba(255,255,255,0.10);
      --text: #f5f7ff;
      --muted: rgba(235,241,255,0.55);
      --ink: #07080d;
      --ink-soft: rgba(7,8,13,0.58);
      --row-line: rgba(0,0,0,0.08);
      --blue: #2f6dff;
      --ruby: #ff2f63;
      --green: #17bb72;
      --gold: #d8b572;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: 'NanumSquareRound', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }

    .site-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;
      height: 82px;
      padding: 0 56px;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto minmax(240px, 1fr);
      align-items: center;
      background: rgba(4, 5, 10, 0.90);
      border-bottom: 1px solid rgba(255,255,255,0.075);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .logo {
      justify-self: start;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.1;
      outline: none;
    }

    .logo-sub {
      margin-bottom: 5px;
      color: rgba(236, 241, 250, 0.54);
      font-size: 10px;
      white-space: nowrap;
    }

    .logo-main {
      position: relative;
      width: 260px;
      height: 30px;
      overflow: hidden;
      color: var(--blue);
      font-family: 'BookkMyungjo', serif;
      font-size: 22px;
      font-weight: 700;
      white-space: nowrap;
      text-shadow: 0 0 18px rgba(47, 109, 255, 0.26);
      filter: none !important;
    }

    .bh-logo-track {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      width: 780px;
      height: 30px;
      transform: translate3d(0, 0, 0);
      transition: transform 760ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      filter: none !important;
    }

    .bh-logo-item {
      flex: 0 0 260px;
      width: 260px;
      height: 30px;
      line-height: 30px;
      color: var(--blue);
      font-family: 'BookkMyungjo', serif;
      font-size: 22px;
      font-weight: 700;
      white-space: nowrap;
      filter: none !important;
    }

    .bh-logo-item span { color: inherit; font: inherit; filter: none !important; }

    nav { justify-self: center; }

    nav ul {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 38px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav li {
      position: relative;
      height: 82px;
      display: flex;
      align-items: center;
    }

    nav a {
      color: rgba(236, 241, 250, 0.68);
      font-size: 15px;
      letter-spacing: -0.015em;
      transition: color 180ms ease;
    }

    nav a:hover, nav a.is-active { color: #fff; }

    .nav-price-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .nav-price-trigger::after {
      content: '';
      width: 6px;
      height: 6px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      opacity: 0.72;
    }

    .price-dropdown {
      position: absolute;
      top: calc(100% - 2px);
      left: 50%;
      min-width: 210px;
      padding: 10px;
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      border: 1px solid rgba(47, 109, 255, 0.24);
      border-radius: 14px;
      background: rgba(7, 10, 20, 0.96);
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.46);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
    }

    .price-dropdown::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -12px;
      height: 12px;
    }

    .price-dropdown a {
      min-height: 42px;
      padding: 0 12px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(236, 241, 250, 0.78);
      font-size: 15px;
    }

    .price-dropdown a::after {
      content: '›';
      color: var(--blue);
      font-size: 18px;
    }

    .price-dropdown a:hover {
      color: #fff;
      background: rgba(47, 109, 255, 0.12);
    }

    .nav-price-menu:hover .price-dropdown,
    .nav-price-menu:focus-within .price-dropdown {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .btn-customer {
      justify-self: end;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 18px;
      border-radius: 999px;
      color: #fff;
      background: rgba(255,255,255,0.035);
      font-size: 13px;
    }

    main {
      width: min(1200px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 112px 0 86px;
    }

    .page-hero {
      position: relative;
      height: 255px;
      overflow: hidden;
      margin-bottom: 30px;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.16) 42%, rgba(0,0,0,0.76) 100%),
        url('va.gif') center center / cover no-repeat;
    }

    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.38;
      background:
        radial-gradient(circle at 48% 48%, rgba(130, 90, 255, 0.28), transparent 34%),
        linear-gradient(90deg, rgba(0,0,0,0.52), transparent 36%, rgba(0,0,0,0.48));
      pointer-events: none;
    }

    .page-hero::after {
      content: 'VALORANT';
      position: absolute;
      left: -18px;
      bottom: -40px;
      color: rgba(255,255,255,0.075);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 150px;
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      pointer-events: none;
    }

    .hero-title-box {
      position: absolute;
      right: 58px;
      top: 45px;
      text-align: right;
      z-index: 2;
    }

    .hero-team {
      display: block;
      margin-bottom: 6px;
      color: #00f5cc;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(0,245,204,0.36);
    }

    .hero-title-box h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(42px, 5vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      font-family: 'NanumSquareRound', 'Pretendard', sans-serif;
      font-weight: normal;
      text-shadow: 0 0 34px rgba(255,255,255,0.34);
    }

    .board-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 94px;
      color: rgba(163, 174, 201, 0.76);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .search-box,
    .admin-add {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      border: 0;
      background: #fff;
      color: #111;
      cursor: pointer;
    }

    .search-box {
      width: 40px;
      color: #a7a7a7;
    }

    .search-box svg { width: 18px; height: 18px; }

    .admin-add {
      min-width: 86px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
    }

    .board-card {
      overflow: hidden;
      border-radius: 20px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 30px 72px rgba(0,0,0,0.38);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      height: 55px;
      color: #111;
      font-size: 13px;
      font-weight: normal;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      text-align: center;
    }

    tbody td {
      height: 60px;
      padding: 0 12px;
      color: #111;
      font-size: 13px;
      border-bottom: 1px solid rgba(0,0,0,0.075);
      text-align: center;
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.notice-pin { background: #fff4f8; }
    tbody tr:hover { background: #f7f9ff; }

    .col-num { width: 70px; }
    .col-title { width: auto; }
    .col-writer { width: 120px; }
    .col-view { width: 80px; }
    .col-date { width: 86px; }
    .col-admin { width: 122px; }

    .title-cell {
      text-align: left;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .title-cell:hover { text-decoration: underline; }

    .pin-label {
      margin-right: 10px;
      color: var(--ruby);
      font-weight: 700;
    }

    .heart { color: #ff1d35; margin-left: 4px; }

    .admin-actions {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .mini-btn {
      height: 28px;
      padding: 0 9px;
      border: 1px solid rgba(0,0,0,0.10);
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 12px;
      cursor: pointer;
    }

    .mini-btn:hover { background: #f2f4f8; }
    .mini-btn.delete { color: #e9194f; }

    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
    }

    .status-chip.ready { background: #7d8799; }
    .status-chip.active { background: #2f6dff; }
    .status-chip.done { background: #17bb72; }
    .status-chip.wait { background: #d8a236; color: #111; }

    .progress-wrap { display: grid; gap: 6px; }
    .progress-line {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9edf5;
    }

    .progress-line i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f6dff, #ff2f63);
    }

    .progress-text {
      color: rgba(7,8,13,0.58);
      font-size: 11px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal.is-open { display: flex; }

    .modal-card {
      width: min(720px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow: auto;
      border-radius: 22px;
      background: #fff;
      color: #111;
      box-shadow: 0 28px 90px rgba(0,0,0,0.50);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      padding: 22px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -0.04em;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #f2f4f8;
      cursor: pointer;
      font-size: 18px;
    }

    .modal-body {
      padding: 24px;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .detail-chip {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #f0f3f8;
      color: rgba(7,8,13,0.70);
      font-size: 12px;
    }

    .detail-content {
      color: rgba(7,8,13,0.76);
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-line;
      word-break: keep-all;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-size: 12px;
      color: rgba(7,8,13,0.62);
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 12px 13px;
      background: #fff;
      color: #111;
      outline: none;
    }

    .field textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .action-btn {
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    .action-btn.secondary {
      background: #eef1f6;
      color: #111;
    }

    .action-btn.danger {
      background: #ff2f63;
      color: #fff;
    }

    @media (max-width: 920px) {
      .site-header {
        height: 74px;
        padding: 0 22px;
        grid-template-columns: 1fr auto;
      }

      nav { display: none; }

      main {
        width: min(100vw - 24px, 760px);
        padding-top: 96px;
      }

      .page-hero { height: 210px; }
      .hero-title-box { right: 28px; top: 44px; }
      .board-top { margin-bottom: 28px; }

      .board-card { overflow-x: auto; }
      table { min-width: 980px; }
    }

    @media (max-width: 560px) {
      .btn-customer { display: none; }
      .page-hero::after { font-size: 92px; }
      .hero-title-box h1 { font-size: 42px; }
    }

  
    /* ===== MOBILE CATEGORY MENU FINAL ===== */
    .mobile-menu-btn,
    .mobile-drawer {
      display: none;
    }

    @media (max-width: 820px) {
      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      header,
      .site-header {
        height: 74px !important;
        min-height: 74px !important;
        padding: 12px 16px !important;
        box-sizing: border-box !important;
        align-items: center !important;
      }

      header nav,
      .site-header nav,
      .site-nav,
      .btn-customer,
      .site-customer {
        display: none !important;
      }

      .logo,
      .site-logo {
        max-width: 215px !important;
        min-width: 0 !important;
        transform: none !important;
      }

      .logo-sub,
      .site-logo-sub {
        font-size: 11px !important;
        line-height: 1 !important;
        margin-bottom: 4px !important;
      }

      .logo-main,
      .site-logo-main {
        width: 210px !important;
        max-width: 210px !important;
        font-size: 23px !important;
        line-height: 1.1 !important;
      }

      .mobile-menu-btn {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        gap: 8px;
        position: fixed;
        top: 16px;
        right: 14px;
        z-index: 10050;
        width: 50px;
        height: 42px;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 14px;
        background: rgba(8, 8, 16, 0.76);
        color: #fff;
        font-family: 'NanumSquareRound', 'Pretendard', sans-serif;
        font-size: 0;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 14px 34px rgba(0,0,0,0.42);
        cursor: pointer;
      }

      .mobile-menu-btn::before,
      .mobile-menu-btn::after,
      .mobile-menu-btn span {
        content: '';
        display: block;
        position: absolute;
        left: 15px;
        width: 20px;
        height: 2px;
        border-radius: 99px;
        background: #fff;
        transition: transform 180ms ease, opacity 180ms ease, top 180ms ease;
      }

      .mobile-menu-btn::before {
        top: 13px;
      }

      .mobile-menu-btn span {
        top: 20px;
      }

      .mobile-menu-btn::after {
        top: 27px;
      }

      body.mobile-menu-open .mobile-menu-btn::before {
        top: 20px;
        transform: rotate(45deg);
      }

      body.mobile-menu-open .mobile-menu-btn span {
        opacity: 0;
      }

      body.mobile-menu-open .mobile-menu-btn::after {
        top: 20px;
        transform: rotate(-45deg);
      }

      .mobile-drawer {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 10040;
        pointer-events: none;
      }

      .mobile-drawer::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.58);
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .mobile-panel {
        position: absolute;
        top: 0;
        right: 0;
        width: min(84vw, 340px);
        height: 100%;
        padding: 86px 18px 26px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at top right, rgba(255, 52, 112, 0.18), transparent 34%),
          linear-gradient(180deg, rgba(10, 8, 20, 0.98), rgba(2, 2, 8, 0.98));
        border-left: 1px solid rgba(255,255,255,0.13);
        box-shadow: -22px 0 60px rgba(0,0,0,0.55);
        transform: translateX(104%);
        transition: transform 220ms cubic-bezier(.2,.8,.2,1);
        overflow-y: auto;
      }

      body.mobile-menu-open {
        overflow: hidden;
      }

      body.mobile-menu-open .mobile-drawer {
        pointer-events: auto;
      }

      body.mobile-menu-open .mobile-drawer::before {
        opacity: 1;
      }

      body.mobile-menu-open .mobile-panel {
        transform: translateX(0);
      }

      .mobile-menu-title {
        margin: 0 0 16px;
        color: rgba(255,255,255,0.48);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-family: 'NanumSquareRound', 'Pretendard', sans-serif;
      }

      .mobile-menu-list {
        display: grid;
        gap: 10px;
      }

      .mobile-menu-list a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 16px;
        border: 1px solid rgba(255,255,255,0.11);
        border-radius: 15px;
        background: rgba(255,255,255,0.055);
        color: #fff;
        text-decoration: none;
        font-family: 'NanumSquareRound', 'Pretendard', sans-serif;
        font-size: 15px;
        font-weight: 800;
      }

      .mobile-menu-list a::after {
        content: '›';
        color: rgba(255,255,255,0.42);
        font-size: 22px;
        line-height: 1;
      }

      .mobile-menu-section {
        margin: 18px 0 8px;
        color: rgba(255,255,255,0.42);
        font-family: 'NanumSquareRound', 'Pretendard', sans-serif;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }

      .mobile-menu-sub {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .mobile-menu-sub a {
        min-height: 42px;
        justify-content: center;
        padding: 0 10px;
        border-radius: 13px;
        font-size: 13px;
        background: rgba(255, 45, 104, 0.10);
        border-color: rgba(255, 45, 104, 0.20);
      }

      .mobile-menu-sub a::after {
        display: none;
      }

      .hero,
      .hero-section,
      .main-hero {
        min-height: calc(100svh - 74px) !important;
      }

      .hero-text-box,
      .hero-content,
      .main-copy {
        width: calc(100vw - 28px) !important;
        max-width: calc(100vw - 28px) !important;
        padding-left: 14px !important;
        padding-right: 14px !important;
        box-sizing: border-box !important;
      }

      .hero-text-box h1 {
        font-size: clamp(35px, 11vw, 54px) !important;
        line-height: 1.08 !important;
        letter-spacing: -0.045em !important;
        word-break: keep-all !important;
      }

      .hero-text-box p,
      .hero-desc,
      .main-copy p {
        font-size: clamp(14px, 4.1vw, 18px) !important;
        line-height: 1.75 !important;
        word-break: keep-all !important;
      }

      .page-hero {
        height: 210px !important;
        margin-top: 74px !important;
      }

      .page-title,
      .page-hero h1 {
        font-size: clamp(34px, 10vw, 52px) !important;
        line-height: 1.08 !important;
        word-break: keep-all !important;
      }

      .board-wrap,
      .board-card,
      .board-table-wrap {
        width: calc(100vw - 22px) !important;
        max-width: calc(100vw - 22px) !important;

<script>
  (() => {
    const initLogoSlider = () => {
      document.querySelectorAll("[data-bh-logo-slider]").forEach((slider) => {
        if (slider.dataset.ready === "1") return;
        slider.dataset.ready = "1";

        const track = slider.querySelector(".bh-logo-track");
        if (!track) return;

        let index = 0;
        let locked = false;
        const HOLD_MS = 2300;
        const MOVE_MS = 760;

        const moveTo = (nextIndex, animated) => {
          const width = slider.getBoundingClientRect().width || 260;
          track.style.transition = animated ? `transform ${MOVE_MS}ms cubic-bezier(0.22, 1, 0.36, 1)` : "none";
          track.style.transform = `translate3d(${-width * nextIndex}px, 0, 0)`;
        };

        const next = () => {
          if (locked) return;
          locked = true;
          index += 1;
          moveTo(index, true);

          window.setTimeout(() => {
            if (index >= 2) {
              index = 0;
              moveTo(0, false);
              void track.offsetWidth;
            }
            locked = false;
          }, MOVE_MS + 40);
        };

        moveTo(0, false);
        window.setInterval(next, HOLD_MS);
        window.addEventListener("resize", () => moveTo(index, false));
      });
    };

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initLogoSlider);
    else initLogoSlider();
  })();
</script>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwu-qf_92PgcOhpyBqd8GZQUTKquS9j6GWoDlixli_h8VECd0GxQHzpM-NpgL-lD4DS/exec";
let adminPassword = "";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function apiGet(type){if(API_URL.includes('APP_SCRIPT')) throw new Error('HTML 안의 API_URL에 Apps Script 웹앱 URL을 넣어야 합니다.'); const r=await fetch(API_URL+'?'+new URLSearchParams({action:'list',type,t:Date.now()})); return await r.json();}
async function apiPost(payload){if(API_URL.includes('APP_SCRIPT')) throw new Error('HTML 안의 API_URL에 Apps Script 웹앱 URL을 넣어야 합니다.'); const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); return await r.json();}
function needPass(){if(adminPassword)return true; const p=prompt('관리자 비밀번호를 입력하세요.'); if(!p)return false; adminPassword=p; return true;}
function openModal(id){document.getElementById(id).classList.add('is-open');}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('is-open'));}

const TYPE='notice'; let items=[];
async function loadItems(){try{const d=await apiGet(TYPE); if(!d.ok)throw new Error(d.message||'불러오기 실패'); items=d.items||[]; render();}catch(e){alert(e.message||e);}}
function render(){const body=document.getElementById('boardBody'); document.getElementById('totalText').textContent=`Total ${items.length}건 1 페이지`; body.innerHTML=items.map(item=>`<tr class="${item.pinned?'notice-pin':''}"><td class="col-num">${item.pinned?'<span class="pin-label">공지</span>':esc(item.no)}</td><td class="title-cell" data-view="${item.id}">${esc(item.title)}<span class="heart">♥</span></td><td>${esc(item.writer)}</td><td>${Number(item.views||0).toLocaleString('ko-KR')}</td><td>${esc(item.date)}</td><td><div class="admin-actions"><button class="mini-btn" data-edit="${item.id}">수정</button><button class="mini-btn delete" data-delete="${item.id}">삭제</button></div></td></tr>`).join('');}
function openDetail(id){const item=items.find(x=>x.id===id); if(!item)return; detailTitle.textContent=item.title; detailMeta.innerHTML=`<span class="detail-chip">번호 ${esc(item.no)}</span><span class="detail-chip">글쓴이 ${esc(item.writer)}</span><span class="detail-chip">조회 ${Number(item.views||0).toLocaleString('ko-KR')}</span><span class="detail-chip">날짜 ${esc(item.date)}</span>`; detailContent.textContent=item.content; openModal('detailModal');}
function openEditor(id=null){if(!needPass())return; const item=id?items.find(x=>x.id===id):null; editTitle.textContent=item?'공지 수정':'공지 작성'; editId.value=item?.id||''; editNo.value=item?.no||String(Math.max(0,...items.map(x=>Number(x.no)||0))+1); editPostTitle.value=item?.title||''; editContent.value=item?.content||''; editWriter.value=item?.writer||'최고관리자'; editViews.value=item?.views??0; editDate.value=item?.date||new Date().toISOString().slice(5,10); editPinned.value=String(Boolean(item?.pinned)); openModal('editModal');}
async function del(id){if(!needPass())return; if(!confirm('정말 삭제할까요?'))return; const r=await apiPost({action:'delete',type:TYPE,password:adminPassword,id}); if(!r.ok){adminPassword=''; alert(r.message||'삭제 실패'); return;} loadItems();}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]')?.dataset.view, ed=e.target.closest('[data-edit]')?.dataset.edit, de=e.target.closest('[data-delete]')?.dataset.delete; if(v)openDetail(v); if(ed)openEditor(ed); if(de)del(de); if(e.target.closest('[data-admin-add]'))openEditor(null); if(e.target.closest('[data-close]')||e.target.classList.contains('modal'))closeModals();});
editForm.addEventListener('submit',async e=>{e.preventDefault(); if(!needPass())return; const item={id:editId.value,no:editNo.value.trim(),title:editPostTitle.value.trim(),content:editContent.value.trim(),writer:editWriter.value.trim()||'최고관리자',views:Number(editViews.value||0),date:editDate.value.trim()||'06-06',pinned:editPinned.value==='true'}; const r=await apiPost({action:'save',type:TYPE,password:adminPassword,item}); if(!r.ok){adminPassword=''; alert(r.message||'저장 실패'); return;} closeModals(); loadItems();});
loadItems();
</script>

<script>
(function () {
  const toggle = document.querySelector('[data-mobile-menu-toggle]');
  const drawer = document.querySelector('[data-mobile-drawer]');
  if (!toggle || !drawer) return;

  const closeMenu = () => {
    document.body.classList.remove('mobile-menu-open');
    toggle.setAttribute('aria-label', '모바일 메뉴 열기');
  };

  const openMenu = () => {
    document.body.classList.add('mobile-menu-open');
    toggle.setAttribute('aria-label', '모바일 메뉴 닫기');
  };

  toggle.addEventListener('click', () => {
    document.body.classList.contains('mobile-menu-open') ? closeMenu() : openMenu();
  });

  drawer.addEventListener('click', (event) => {
    if (event.target === drawer || event.target.closest('a')) closeMenu();
  });

  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMenu();
  });
})();
</script>
